<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="600" viewBox="0 0 1120 600" role="img" aria-labelledby="title description"><title id="title">Skill Impact comparison</title><desc id="description">synthetic. Quality difference inconclusive. Mean assertion pass rate. Not proof of causal improvement.</desc><rect width="1120" height="600" fill="#101821"/><g fill="#eef4fa" font-family="sans-serif"><text x="48" y="62" font-size="20" fill="#83e3c5">SKILL IMPACT / EVIDENCE CARD</text><text x="48" y="123" font-size="36">Quality difference inconclusive</text><text x="48" y="162" font-size="17" fill="#ffd28d">SYNTHETIC · 4 task clusters · 8 quality pairs</text><text x="48" y="220" font-size="22">Mean assertion pass rate</text><text x="48" y="268" font-size="36">62.5% → 75.0%</text><text x="48" y="320" font-size="21">Completion time: 17.6 → 13.6 s</text><text x="48" y="365" font-size="21">Total tokens: Unknown → Unknown</text><text x="48" y="410" font-size="21">Cost (USD): Unknown → Unknown</text><text x="48" y="465" font-size="17" fill="#adbecf">95% quality-difference bootstrap interval: [-25.0, 50.0] pp</text><text x="48" y="512" font-size="16" fill="#adbecf">Completion time is not first-token latency. Unknown metrics stay unknown.</text><text x="48" y="550" font-size="16" fill="#ffd28d">Synthetic fixture: validates integration only.</text></g></svg>